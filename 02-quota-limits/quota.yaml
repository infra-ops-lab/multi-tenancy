# A budget for the whole namespace. The API server rejects any new pod that would push the
# namespace over these totals. Running pods are never evicted by a quota.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: team-a-quota
  namespace: team-a
spec:
  hard:
    requests.cpu: "2"        # sum of CPU requests of all pods
    requests.memory: 2Gi
    limits.cpu: "4"          # sum of CPU limits of all pods
    limits.memory: 4Gi
    pods: "10"               # object counts can be limited too
    services.loadbalancers: "0"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: team-b-quota
  namespace: team-b
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    pods: "10"
    services.loadbalancers: "0"
